# infra/docker-compose.yml
services:
  db-chic-912:
    image: postgres:15.3-alpine
    container_name: postgres-chic-912
    # restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes: # donde se guardan los datos de la base de datos
      - ./data:/var/lib/postgresql/data